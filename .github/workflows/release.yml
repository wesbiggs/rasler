name: Release

# A tag is the only thing that publishes. The order below is deliberate: everything
# that can fail cheaply runs before anything reaches npm, and the GitHub release
# comes last -- a version can only be un-published for 72 hours, so announcing a
# release nobody can install is the wrong order to fail in.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci

      # npm resolves the version from package.json and ignores the tag entirely, so a
      # tag that disagrees with it would publish under a number nobody tagged. Catch
      # that here, before the publish job can act on it.
      - name: The tag must match the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag $tag != package.json $pkg"; exit 1; }

      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

      # Pack here and publish this exact tarball below, so the artifact that was
      # tested is the artifact that reaches npm rather than a second, re-resolved one.
      - name: Pack the tarball that will be published
        run: |
          mkdir -p dist # npm 11.12 errors on a missing --pack-destination instead of creating it
          npm pack --pack-destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # Naming an environment is what lets the repo require a manual approval before
    # anything reaches npm, without changing this workflow.
    environment:
      name: npm
      url: https://www.npmjs.com/package/rasler
    permissions:
      id-token: write # the OIDC token Trusted Publishing exchanges; no npm token in secrets
    steps:
      - uses: actions/checkout@v4 # for .tool-versions, so Node is pinned in one place
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org

      # Staging needs npm 11.15.0 -- a higher bar than Trusted Publishing's own 11.5.1,
      # and the reason .tool-versions pins Node 24.22 (npm 11.19) rather than 24.15
      # (npm 11.12). This is a guard against that pin moving backwards.
      - name: Staged publishing needs npm 11.15.0 or newer
        run: |
          have=$(npm --version)
          echo "npm $have"
          test "$(printf '11.15.0\n%s\n' "$have" | sort -V | head -1)" = "11.15.0" \
            || { echo "::error::npm $have is older than 11.15.0"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist/

      # No NODE_AUTH_TOKEN: the OIDC token above is exchanged for a short-lived
      # registry credential, and npm attaches build provenance on its own.
      #
      # `stage publish` rather than `publish`: a trusted publisher created after
      # 2026-09-03 allows staging by default and direct publishing only where that was
      # granted explicitly, so plain `npm publish` comes back 403 "OIDC permission
      # denied for this action". Staging leaves the version in the registry but not
      # public until a maintainer approves it with 2FA, which OIDC cannot do -- that
      # step is manual on purpose and the summary below says how.
      #
      # A tarball argument is accepted here even though only `npm publish` documents
      # it; without one the command packs the working directory instead.
      #
      # The leading ./ is load-bearing: npm reads a bare `dist/x.tgz` as the GitHub
      # shorthand owner/repo and tries to git-clone it rather than read the file.
      - name: Stage the release on npm
        run: |
          tarballs=(./dist/*.tgz)
          test "${#tarballs[@]}" -eq 1 \
            || { echo "::error::expected one tarball in dist/, found ${#tarballs[@]}"; exit 1; }
          npm stage publish "${tarballs[0]}"

      - name: Say what is still needed to make it live
        run: |
          {
            echo "### \`$GITHUB_REF_NAME\` is staged, not published"
            echo
            echo "Approve it to go live (needs 2FA; OIDC is not allowed to approve):"
            echo
            echo '```'
            echo 'npm stage list rasler'
            echo 'npm stage approve <stage-id>'
            echo '```'
            echo
            echo "Or npmjs.com -> rasler -> **Staged Packages** -> Approve."
            echo
            echo "The GitHub release is held as a draft until then."
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    # Last, and only once npm has accepted the package -- as a draft, because a staged
    # version is not installable until it is approved. Publishing the draft is the
    # other half of that same approval.
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release is the one thing here that writes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag $flags dist/*.tgz
